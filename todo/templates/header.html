<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}ToDo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="logo">ToDo</h1>
      <nav class="nav">
        <a class="nav-btn" href="{{ url_for('todo.index') }}">Accueil</a>
        <a class="nav-btn" href="{{ url_for('todo.tasks') }}">Tâches</a>
        <a class="nav-btn" href="{{ url_for('todo.new_task') }}">Ajouter</a>
      </nav>
      <div class="hint">Flask + SQLite</div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
